[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nvmon"
dynamic = ["version"]
description = "A fancy NVIDIA GPU monitor for the terminal. Single Python file, no dependencies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.6"
authors = [{ name = "Han DongHeun" }]
dependencies = []
keywords = ["nvidia", "gpu", "monitor", "nvml", "terminal", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

[project.urls]
Source = "https://github.com/Han-DongHeun/nvmon"
Issues = "https://github.com/Han-DongHeun/nvmon/issues"
Changelog = "https://github.com/Han-DongHeun/nvmon/releases"

[project.scripts]
nvmon = "nvmon:main"

[tool.hatch.version]
path = "nvmon.py"

[tool.hatch.build.targets.wheel]
only-include = ["nvmon.py"]

[tool.hatch.build.targets.sdist]
only-include = ["nvmon.py", "README.md", "LICENSE"]
